# ============================================================
# Configuracion de la base de datos H2 (en memoria)
# No necesita instalacion, Spring Boot la crea automaticamente
# ============================================================

spring.datasource.url=jdbc:h2:mem:tiendainstrumentos
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Activar la consola H2 para ver la base de datos en el navegador
# Entrar a: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Nombre de la aplicacion
spring.application.name=Gestion-Instrumentos-Musicales
